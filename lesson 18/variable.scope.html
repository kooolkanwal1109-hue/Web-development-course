<!DOCTYPE html>
<html>
    <body>
        <p>A function can access variables declared within its own scope.</p>
        <button onclick="myFunction()">click me!</button>
        <p id="demo"></p>
        <P id="demo1"></P>
        <script>
            var b = 5;
            function myFunction() {
                var a = 4;
                document.getElementById("demo").innerHTML = b * a;
            }
            document.getElementById("demo1").innerHTML = b;
        </script>
    </body>
</html>
