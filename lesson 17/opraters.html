<!DOCTYPE html>
<html>

<body>

<h2> Operator</h2>
<p id="demo"></p>
<p id="demo1"></p>
<p id="demo2"></p>
<p id="demo3"></p>
<p id="demo4"></p>
<p id="demo5"></p>
<script>
<!-- Addition -->
//*use +, -, *, / operators*/
var x = 5;
var y = 2;
var z = x + y;
var c = x - y;
var d = x * y;
var e = x / y;
var f = x % y;
document.getElementById("demo").innerHTML = z + " is the sum of x and y";
document.getElementById("demo1").innerHTML = c + " is the difference of x and y";
document.getElementById("demo2").innerHTML = d + " is the product of x and y";
document.getElementById("demo3").innerHTML = e + " is the quotient of x and y";
document.getElementById("demo4").innerHTML = f + " is the remainder of x and y";

</script>

</body>

</html>
