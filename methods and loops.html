<h2>Methods and Loops</h2>
<p>Numbers from 1 to 10</p>
<p id="numbers"></p>
<p id="random"></p>
<p id="day"></p>

<script>
  <!-- HTML Element -->
<p id="numbers"></p>

<!-- JavaScript -->

    let text = "";
    for (let i = 1; i <= 10; i++) {
        text += i + "<br>";
    }
    document.getElementById("numbers").innerHTML = text;

    <!-- HTML Element -->
<p id="random"></p>

<!-- JavaScript -->

    let randomNumber = Math.floor(Math.random() * 100);
    document.getElementById("random").innerHTML = "The random number is " + randomNumber;


<!-- HTML Element -->
<p id="day"></p>

<!-- JavaScript -->

    let dayNumber = new Date().getDay();
    document.getElementById("day").innerHTML = "Today's day number is " + dayNumber;

</script>
