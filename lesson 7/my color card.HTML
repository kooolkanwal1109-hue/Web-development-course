<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Color Card</title>
   
    <style>

    /* Universal Selector - applies to everything on the page */
    
    * {
        box-sizing: border-box;
        margin: 135px;
        padding: 37px;
    }   

   <p>/* Body Selector - applies to the body of the page */
    body {
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
    }

    /* Class Selector - applies to elements with the class "color-card" */
    .color-card {
        background-color: #ffffff;
        border: 1px solid #cccccc;
        border-radius: 8px;
        padding: 20px;
        margin: 20px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    /* ID Selector - applies to the element with the ID "main-title" */
    #main-title {
        color: #333333;
        font-size: 24px;
        margin-bottom: 10px;
    }

    /* Element Selector - applies to all <p> elements */
    p {
        color: #666666;
        font-size: 16px;
    }

    </style>
